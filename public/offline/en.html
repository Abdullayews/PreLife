<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No internet | PreLife</title>
<script>try{if(localStorage.getItem('pl-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
  :root { color-scheme: light;
    --bg:#f6f3ed; --tint:#efeae0; --ink:#1f1d1a; --muted:#6a655a; --line:rgba(31,29,26,.13);
    --accent:#7b2d3b; --accent-ink:#fff; --raised:#fffefb;
    --shadow: 0 18px 44px -18px rgba(31,29,26,.28); }
  html.dark { color-scheme: dark;
    --bg:#171412; --tint:#1b1816; --ink:#f1ebe3; --muted:#a39b8f; --line:rgba(241,235,227,.14);
    --accent:#e59aa6; --accent-ink:#2a0f15; --raised:#282219;
    --shadow: 0 18px 44px -18px rgba(0,0,0,.55); }
  * { box-sizing: border-box; margin: 0; }
  body {
    display: grid; min-height: 100svh; place-items: center; padding: 1.5rem;
    background: var(--bg); color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .card {
    display: grid; justify-items: center; gap: 1rem; max-width: 26rem;
    padding: clamp(1.9rem, 5vw, 2.8rem); text-align: center;
    background: var(--raised); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow);
  }
  .chip {
    display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 16px;
    background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent);
  }
  .eyebrow {
    display: flex; align-items: center; gap: .7rem; font-size: .72rem; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: var(--muted);
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 2rem; height: 1px; background: var(--accent); }
  h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    font-size: clamp(1.9rem, 6vw, 2.6rem); line-height: 1.05; letter-spacing: -.02em;
  }
  p.txt { color: var(--muted); font-size: .95rem; line-height: 1.55; }
  .btn {
    display: inline-flex; align-items: center; gap: .55rem; min-height: 2.9rem; padding-inline: 1.4rem;
    margin-top: .35rem; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
    font-size: .9rem; font-weight: 650; cursor: pointer; transition: filter .2s, transform .2s;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .brand { margin-top: .8rem; font-size: .95rem; color: var(--muted); }
  .brand b { color: var(--ink); font-weight: 700; font-style: normal; }
  .brand em { color: var(--accent); font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
  <main class="card">
    <span class="chip">
      <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
    </span>
    <p class="eyebrow">PreLife</p>
    <h1>No internet</h1>
    <p class="txt">This page is served from cache. The site will refresh automatically once your connection is back.</p>
    <button class="btn" type="button" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Try again
    </button>
    <p class="brand"><b>Pre</b><em>Life</em></p>
  </main>
  <script>
    // Auto-recover: as soon as the connection is back, reload into the
    // page the visitor originally asked for.
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
