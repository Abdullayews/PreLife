<?xml version="1.0" encoding="utf-8"?>
<!-- PreLife icon v2 — the golden wand + twinkle.
     Reference: user-provided design (golden gradient wand, four-point
     sparkle on near-black). Keeps the v1 "living icon" DNA: the sparkle
     gently twinkles where SVG favicon animation is supported. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <defs>
    <!-- Wand gold: light cream-gold -> deeper bronze, lit from above. -->
    <linearGradient id="pl-wand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E4A6"/>
      <stop offset=".55" stop-color="#E0B45C"/>
      <stop offset="1" stop-color="#B9832F"/>
    </linearGradient>
    <!-- Sparkle gold: brighter, so the twinkle reads as the light source. -->
    <linearGradient id="pl-spark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEDB8"/>
      <stop offset="1" stop-color="#DCA743"/>
    </linearGradient>
    <style type="text/css">
      .pl-tile { fill:#0B0B0D; stroke:rgba(255,255,255,.12); stroke-width:.6; stroke-miterlimit:10; }
      .pl-wand { fill:url(#pl-wand); }
      .pl-sheen { fill:#FFEFC2; opacity:.5; }
      .pl-spark { fill:url(#pl-spark); }
      .pl-twinkle {
        animation: pl-twinkle 2.8s ease-in-out infinite;
        transform-box: fill-box; transform-origin: center;
      }
      @keyframes pl-twinkle {
        0%, 100% { transform: scale(1) rotate(0deg); opacity: .92; }
        50%      { transform: scale(1.07) rotate(5deg); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Near-black rounded tile (matches the dark theme-color #0d0d0f). -->
  <rect class="pl-tile" x="1.5" y="1.5" width="27" height="27" rx="7.2"/>

  <!-- The wand: a vertical golden pill on the left. -->
  <rect class="pl-wand" x="8.2" y="7.4" width="3.5" height="15.2" rx="1.75"/>
  <!-- A thin left-side sheen — polished-gold depth at larger sizes. -->
  <rect class="pl-sheen" x="9.0" y="8.9" width=".8" height="12.2" rx=".4"/>

  <!-- The twinkle: four-point sparkle with concave curves, upper right.
       Placed so the wand+sparkle group reads optically centered: the
       sparkle's mass pulls right-up, the solid pill anchors left-down. -->
  <g class="pl-twinkle">
    <path class="pl-spark" transform="translate(20.1 12) scale(5.6)"
      d="M0,-1 C.13,-.21 .21,-.13 1,0 C.21,.13 .13,.21 0,1 C-.13,.21 -.21,.13 -1,0 C-.21,-.13 -.13,-.21 0,-1 Z"/>
  </g>
</svg>
