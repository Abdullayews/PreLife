[package]
name = "prelife-api"
version = "1.1.0"
edition = "2021"
description = "PreLife backend — 100% Rust (axum). Content + user APIs on Supabase Postgres; accounts verified by Supabase Auth (GoTrue)."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
opt-level = 1
